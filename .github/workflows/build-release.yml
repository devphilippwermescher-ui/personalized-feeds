name: Build and Release Extension

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release.outputs.version }}
      version_changed: ${{ steps.release.outputs.version_changed }}
      short_sha: ${{ steps.release.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and inspect product version
        id: release
        run: node scripts/inspect-release.mjs
        env:
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Type check extension
        run: npm run type-check --prefix extension

      - name: Test extension
        run: npm test --prefix extension

      - name: Build extension
        run: npm run build --prefix extension
        env:
          APP_ENV: ${{ github.event_name == 'pull_request' && 'development' || 'staging' }}
          BUILD_LABEL: ${{ github.event_name == 'pull_request' && format('dev-pr-{0}-{1}', github.event.pull_request.number, steps.release.outputs.short_sha) || format('staging-{0}', steps.release.outputs.short_sha) }}

      - name: Create development archive
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cd extension/dist
          zip -r "../../myfeedpilot-development-pr-${{ github.event.pull_request.number }}-${{ steps.release.outputs.short_sha }}.zip" .

      - name: Create staging archive
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd extension/dist
          zip -r "../../myfeedpilot-staging-${{ steps.release.outputs.short_sha }}.zip" .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: myfeedpilot-${{ github.event_name == 'pull_request' && 'development' || 'staging' }}-${{ github.sha }}
          path: myfeedpilot-*.zip
          if-no-files-found: error
          retention-days: 30

  development-build:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Build development extension
        run: npm run build --prefix extension
        env:
          APP_ENV: development
          BUILD_LABEL: dev-main-${{ needs.build.outputs.short_sha }}

      - name: Create development extension archive
        shell: bash
        run: |
          cd extension/dist
          zip -r "../../myfeedpilot-development-${{ needs.build.outputs.short_sha }}.zip" .

      - name: Upload development extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: myfeedpilot-development-${{ github.sha }}
          path: myfeedpilot-development-${{ needs.build.outputs.short_sha }}.zip
          if-no-files-found: error
          retention-days: 30

  production-build:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Build production extension
        run: npm run build --prefix extension
        env:
          APP_ENV: production
          BUILD_LABEL: production

      - name: Create production extension archive
        shell: bash
        run: |
          cd extension/dist
          zip -r "../../myfeedpilot-v${{ needs.build.outputs.version }}.zip" .
          cp "../../myfeedpilot-v${{ needs.build.outputs.version }}.zip" "../../myfeedpilot-latest.zip"

      - name: Upload production extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: myfeedpilot-production-${{ github.sha }}
          path: |
            myfeedpilot-v${{ needs.build.outputs.version }}.zip
            myfeedpilot-latest.zip
          if-no-files-found: error
          retention-days: 30

  staging-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: myfeedpilot-staging-${{ github.sha }}

      - name: Create staging pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-${{ github.run_number }}-${{ needs.build.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          name: Staging ${{ needs.build.outputs.short_sha }} (v${{ needs.build.outputs.version }})
          body: |
            Automatic staging release from `main`.

            Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          make_latest: false
          files: myfeedpilot-staging-${{ needs.build.outputs.short_sha }}.zip

  production-release:
    needs: [build, production-build]
    if: github.event_name == 'push' && needs.build.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: myfeedpilot-production-${{ github.sha }}

      - name: Create production release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ needs.build.outputs.version }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            myfeedpilot-v${{ needs.build.outputs.version }}.zip
            myfeedpilot-latest.zip

  deploy-team-hub:
    needs: [build, development-build, staging-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: extension-team-hub
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download development extension
        uses: actions/download-artifact@v4
        with:
          name: myfeedpilot-development-${{ github.sha }}
          path: release-artifacts/development

      - name: Download staging extension
        uses: actions/download-artifact@v4
        with:
          name: myfeedpilot-staging-${{ github.sha }}
          path: release-artifacts/staging

      - name: Prepare team downloads and metadata
        shell: bash
        run: |
          mkdir -p sites/team/downloads
          cp release-artifacts/development/myfeedpilot-development-${{ needs.build.outputs.short_sha }}.zip sites/team/downloads/myfeedpilot-development-latest.zip
          cp release-artifacts/staging/myfeedpilot-staging-${{ needs.build.outputs.short_sha }}.zip sites/team/downloads/myfeedpilot-staging-latest.zip
          node scripts/write-site-release-metadata.mjs team sites/team/release.json

      - name: Deploy team release hub
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: sites/team
          channelId: live

  deploy-production-landing:
    needs: [build, production-build, production-release]
    if: github.event_name == 'push' && needs.build.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: extension-production-landing
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write production release metadata
        run: node scripts/write-site-release-metadata.mjs landing sites/landing/release.json

      - name: Deploy production landing
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: sites/landing
          channelId: live
