name: Build and Release Extension

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release.outputs.version }}
      version_changed: ${{ steps.release.outputs.version_changed }}
      short_sha: ${{ steps.release.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and inspect product version
        id: release
        run: node scripts/inspect-release.mjs
        env:
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Type check extension
        run: npm run type-check --prefix extension

      - name: Test extension
        run: npm test --prefix extension

      - name: Build extension
        run: npm run build --prefix extension
        env:
          APP_ENV: ${{ github.event_name == 'pull_request' && 'development' || 'staging' }}

      - name: Create extension archive
        shell: bash
        run: |
          cd extension/dist
          zip -r "../../personalized-feeds-build-${{ steps.release.outputs.short_sha }}.zip" .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: personalized-feeds-${{ github.sha }}
          path: personalized-feeds-build-${{ steps.release.outputs.short_sha }}.zip
          if-no-files-found: error
          retention-days: 30

  production-build:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Build production extension
        run: npm run build --prefix extension
        env:
          APP_ENV: production

      - name: Create production extension archive
        shell: bash
        run: |
          cd extension/dist
          zip -r "../../personalized-feeds-v${{ needs.build.outputs.version }}.zip" .

      - name: Upload production extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: personalized-feeds-production-${{ github.sha }}
          path: personalized-feeds-v${{ needs.build.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  staging-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: personalized-feeds-${{ github.sha }}

      - name: Name staging archive
        run: mv "personalized-feeds-build-${{ needs.build.outputs.short_sha }}.zip" "personalized-feeds-staging-${{ needs.build.outputs.short_sha }}.zip"

      - name: Create staging pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-${{ github.run_number }}-${{ needs.build.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          name: Staging ${{ needs.build.outputs.short_sha }} (v${{ needs.build.outputs.version }})
          body: |
            Automatic staging release from `main`.

            Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          make_latest: false
          files: personalized-feeds-staging-${{ needs.build.outputs.short_sha }}.zip

  production-release:
    needs: [build, production-build]
    if: github.event_name == 'push' && needs.build.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: personalized-feeds-production-${{ github.sha }}

      - name: Create production release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ needs.build.outputs.version }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: personalized-feeds-v${{ needs.build.outputs.version }}.zip
