<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myFeedPilot Auth Helper</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }

      .card {
        max-width: 440px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }

      .status {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <p class="status" id="status">Waiting for the extension to start sign-in.</p>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
      } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

      const statusEl = document.getElementById('status');
      const params = new URLSearchParams(window.location.search);
      const extensionId = params.get('extensionId');
      const extensionOrigin = extensionId?.match(/^[a-p]{32}$/) ? `chrome-extension://${extensionId}` : null;

      const firebaseConfigs = {
        development: {
          apiKey: 'AIzaSyB6kAzSDEJ8o9kEznq5X6igpUb6Jvlgsk4',
          authDomain: 'myfeedpilot-dev.firebaseapp.com',
          projectId: 'myfeedpilot-dev',
          storageBucket: 'myfeedpilot-dev.firebasestorage.app',
          messagingSenderId: '234163823433',
          appId: '1:234163823433:web:4b6c2fc058aeab076e7098',
          measurementId: 'G-KVZFT26V37',
        },
        staging: {
          apiKey: 'AIzaSyA2zeEsr0lYSGCt4m276mnR9HjgiTUUhEQ',
          authDomain: 'myfeedpilot-staging.firebaseapp.com',
          projectId: 'myfeedpilot-staging',
          storageBucket: 'myfeedpilot-staging.firebasestorage.app',
          messagingSenderId: '701144218123',
          appId: '1:701144218123:web:de3819b26a4d067b29250e',
          measurementId: 'G-NMMJNGW2C5',
        },
        production: {
          apiKey: 'AIzaSyAjF3vVaa_YmgPaQ81hRqo-l5QLM1RUsCs',
          authDomain: 'myfeedpilot-production.firebaseapp.com',
          projectId: 'myfeedpilot-production',
          storageBucket: 'myfeedpilot-production.firebasestorage.app',
          messagingSenderId: '707587386707',
          appId: '1:707587386707:web:2bb76c0038b59107e4c5a6',
          measurementId: 'G-HZ0JZ6SNW6',
        },
      };

      const hostname = window.location.hostname;
      let environment = 'production';
      if (hostname.includes('myfeedpilot-dev') || ['localhost', '127.0.0.1'].includes(hostname)) {
        environment = 'development';
      } else if (hostname.includes('myfeedpilot-staging')) {
        environment = 'staging';
      }
      const firebaseConfig = firebaseConfigs[environment];

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();
      let authStarted = false;

      if (extensionOrigin) {
        window.parent.postMessage({ type: 'LFA_AUTH_READY' }, extensionOrigin);
      }

      function postResult(payload) {
        if (!extensionOrigin) {
          return;
        }
        window.parent.postMessage(payload, extensionOrigin);
      }

      async function startAuth() {
        if (!extensionOrigin) {
          statusEl.textContent = 'A valid extension ID is required to start sign-in.';
          return;
        }

        if (authStarted) {
          return;
        }

        authStarted = true;
        statusEl.textContent = 'Opening Google sign-in…';

        try {
          const result = await signInWithPopup(auth, provider);
          const credential = GoogleAuthProvider.credentialFromResult(result);

          if (!credential?.idToken || !credential.accessToken) {
            throw new Error('Google sign-in did not return the expected tokens.');
          }

          statusEl.textContent = 'Sign-in complete. You can close this popup.';
          postResult({
            type: 'LFA_AUTH_RESULT',
            success: true,
            idToken: credential.idToken,
            accessToken: credential.accessToken,
          });
        } catch (error) {
          authStarted = false;
          const message = error instanceof Error ? error.message : String(error);
          statusEl.textContent = `Sign-in failed: ${message}`;
          postResult({
            type: 'LFA_AUTH_RESULT',
            success: false,
            error: message,
          });
        }
      }

      window.addEventListener('message', (event) => {
        if (!extensionOrigin || event.origin !== extensionOrigin) {
          return;
        }

        if (event.data?.type === 'LFA_AUTH_START') {
          void startAuth();
        }
      });
    </script>
  </body>
</html>
